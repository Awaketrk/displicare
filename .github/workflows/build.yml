name: Build

# Every push and pull request: compile on a clean Windows machine so a broken build shows up immediately.
# Tags (v1.2.3): build the full release with build-release.ps1 and publish it as a GitHub Release.
# Manual run (Actions tab > Build > Run workflow): build the release packages as a downloadable artifact
# without publishing anything, to check packaging before tagging.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (e.g. 2.1.1). Nothing is published.'
        required: true

# Read-only by default; only the publish step below gets write access
permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Compile app and tests (Release x64)
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\MSBuild.exe" Tests/Displicare.Tests.csproj /p:Configuration=Release /p:Platform=x64 /t:Rebuild /verbosity:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          ./Tests/bin/Release/Displicare.Tests.exe
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: Displicare-${{ github.sha }}
          path: bin/Release/Displicare.exe
          retention-days: 14

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $v = '${{ inputs.version }}' } else { $v = '${{ github.ref_name }}' }
          $v = $v.Trim().TrimStart('v', 'V')
          if ($v -notmatch '^\d+\.\d+(\.\d+){0,2}$') { throw "Not a release version: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # build-release.ps1 runs the unit tests first and stops if any fail
      - name: Build release packages
        shell: pwsh
        run: ./build-release.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Upload packages (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Displicare-v${{ steps.ver.outputs.version }}-packages
          path: dist/v${{ steps.ver.outputs.version }}/*
          retention-days: 14

      - name: Publish GitHub Release (tags)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          # Never overwrite a release that already exists (e.g. one uploaded by hand)
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release v$v already exists; not touching it."; exit 0 }
          gh release create "v$v" (Get-ChildItem "dist/v$v/*").FullName --title "Displicare v$v" --generate-notes
